services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-atlas_learning}
      POSTGRES_USER: ${POSTGRES_USER:-atlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atlas_change_me}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atlas} -d ${POSTGRES_DB:-atlas_learning}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - atlas_postgres:/var/lib/postgresql/data

  migrate:
    build: .
    restart: "no"
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://atlas:atlas_change_me@db:5432/atlas_learning}
      UPLOAD_DIR: /app/data/uploads
    command: ["sh", "-c", "node scripts/migrate.mjs && node scripts/seed.mjs && node scripts/seed-academic.mjs"]
    volumes:
      - atlas_uploads:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://atlas:atlas_change_me@db:5432/atlas_learning}
      UPLOAD_DIR: /app/data/uploads
    ports:
      - "3000:3000"
    volumes:
      - atlas_uploads:/app/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  atlas_postgres:
  atlas_uploads:
